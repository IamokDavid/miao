<script id="ch0103/17">
    var x1 = Number(prompt("x1 : "))
    var y1 = Number(prompt("y1 : "))
    var x2 = Number(prompt("x2 : "))
    var y2 = Number(prompt("y2 : "))
    var x3 = Number(prompt("x3 : "))
    var y3 = Number(prompt("y3 : "))
    var a = Math.pow((x1 - x2), 2)
    var b = Math.pow((y1- y2),2)
    var s12 = Math.sqrt(a + b)
    a = Math.pow((x1 - x3), 2)
    b = Math.pow((y1- y3),2)
    var s13 = Math.sqrt(a + b)
    a = Math.pow((x2 - x3), 2)
    b = Math.pow((y2- y3),2)
    var s23 = Math.sqrt(a + b)
    var l = (s12 + s13 + s23) / 2

    console.log(s.toFixed(2))
</script>

<script id="ch0104/20">
    var a = Number(prompt("a"))
    var b = Number(prompt("b"))
    var c = Number(prompt("c"))

    if (delta == 0) {
        var x = (-b / 2 * a).toFixed(5)
        console.log("x1=x2=" + x)
    } else if (delta > 0) {
        var x1 = ((-b + Math.sqrt(delta)) / 2 * a).toFixed(5) 
        var x2 = ((-b - Math.sqrt(delta)) / 2 * a ).toFixed(5)
        console.log("x1=" + x1 + ";x2 =" + x2)
    } else {
        var x = (-b / 2 * a).toFixed(5)
        var y =  (Math.sqrt(-delta) / 2 * a).toFixed(5)
        console.log("x1=" + x + "+" + y + "i;x2=" + x + "-" + y + "i")
    }
</script>
